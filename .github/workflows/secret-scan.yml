# MANAGED BY TERRAFORM — do not edit here. This file is written to every repo
# in the fleet from 21StarkCom/21stark (repos/secret_scan.tf); a hand edit is
# reverted by the next apply. Change the template there instead.
#
# Secret scanning via the fleet's ONE reusable workflow.
#
# The scan logic lives in 21StarkCom/.github so a fix or a gitleaks bump is one
# PR for the whole fleet instead of one per repo. This file is deliberately
# thin: if you need to change scan behaviour, add an input to the reusable
# workflow rather than steps here.
#
# This repo's ruleset stays here in .gitleaks.toml — the mechanism is shared and
# public, the exclusions are per-repo and private. That file is this repo's to
# edit; Terraform seeds it once where it is missing and never touches it again.
#
# PINNED BY SHA, never @main: a mutable ref inside a check that is meant to
# become REQUIRED is a fleet-wide remote-code-execution surface and an
# unauditable change channel. Bumping the pin is a reviewable PR on 21stark.
#
# DO NOT RENAME THE JOB BELOW. A reusable workflow's check run is named
# "<caller job> / <called job>", so this name is half of the status-check
# context a branch ruleset requires. Renaming it silently breaks enforcement,
# and a ruleset requiring a context that never reports blocks EVERY merge here.

name: secret-scan

on:
  pull_request:
  # Scan the default branch on push too: a direct push bypasses a PR-only check
  # entirely, which is exactly the path someone takes in a hurry. This is
  # detection after the fact, not prevention — a secret pushed to the default
  # branch is already burned and must be rotated — but it gets NOTICED. It also
  # produces a check run ON the default branch, which is the precondition for
  # ever requiring this context in a ruleset.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but NEVER cancel a push run: each push scans its
  # own commit range, so a cancelled one leaves those commits unscanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    uses: 21StarkCom/.github/.github/workflows/secret-scan.yml@7369ce7b9ceb33d1bcea72adf8d7855f6a9c4c4e

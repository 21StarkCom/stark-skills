# Auto-publish: regenerate bifrost (the marketplace) from this repo (the
# source of truth) and open a PR there. The marketplace's own CI (validate /
# build --check / check-bumps / tests / gitleaks) gates the PR before merge.
#
# PREREQUISITES (one-time, set in this repo's settings):
#   - Secret STARK_CLAUDE_APP_ID        = the Stark Claude 21S GitHub App ID (4094779)
#   - Secret STARK_CLAUDE_PRIVATE_KEY   = the Stark Claude 21S App private key (PEM)
#   - The Stark Claude 21S App must be INSTALLED on 21StarkCom/bifrost with
#     `contents: write` + `pull_requests: write` (it mints a scoped token here).
#
# The engine is pure Go (no Node needed): `stark sync` copies the .ts tools
# verbatim into the vendor snapshot; nothing executes them in CI.
name: marketplace-sync

on:
  push:
    branches: [main]
    paths:
      - "skill/**"
      - "tools/**"
      - "global/**"
      - "scripts/**"
      - "standards/**"
      - "plugins/stark-gh/**"
      - "runtime-overrides/codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint stark-claude token (scoped to bifrost)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.STARK_CLAUDE_APP_ID }}
          private-key: ${{ secrets.STARK_CLAUDE_PRIVATE_KEY }}
          owner: 21StarkCom
          repositories: bifrost

      - name: Checkout stark-skills (source of truth)
        uses: actions/checkout@v4
        with:
          path: stark-skills

      - name: Checkout bifrost (the marketplace)
        uses: actions/checkout@v4
        with:
          repository: 21StarkCom/bifrost
          path: bifrost
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bifrost/engine/go.sum

      - name: Regenerate, auto-bump changed bundles, rebuild, gate
        working-directory: bifrost
        run: |
          set -euo pipefail
          SK="$GITHUB_WORKSPACE/stark-skills"

          # 1. Regenerate the catalog + vendor snapshot, then build both runtime
          #    surfaces. This first build deliberately reads bifrost's current
          #    root VERSION; if Codex output changes, step 3 bumps VERSION and
          #    the final build emits the new cache-invalidating version.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog )

          # 2. Bump the patch version of every Claude bundle whose rendered
          #    package changed. dist/claude/<bundle> is the complete Claude
          #    distribution surface, including vendored tools/config/prompts.
          #    Do not infer Claude version bumps from catalog paths: the catalog
          #    also carries Codex-only runtime overrides that must not change
          #    Claude package versions.
          changed=$(git status --porcelain dist/claude \
            | sed -nE 's#^.{2} "?dist/claude/([^/]+)/.*#\1#p' \
            | sort -u)
          for b in $changed; do
            f="catalog/$b/bundle.yaml"
            cur=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$f")
            IFS=. read -r MA MI PA <<< "$cur"
            new="$MA.$MI.$((PA + 1))"
            perl -i -pe "s/^version: \\Q$cur\\E\$/version: $new/" "$f"
            echo "bumped $b: $cur -> $new"
          done

          # 3. Codex marketplace plugins use the bifrost root VERSION as their
          #    cache key. If the first build changed any Codex package, advance
          #    that VERSION exactly one patch before rebuilding so installed
          #    Codex caches cannot retain the prior package contents.
          if [ -n "$(git status --porcelain dist/codex-plugins)" ]; then
            root_cur=$(tr -d '\r\n' < VERSION)
            if ! [[ "$root_cur" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid bifrost VERSION: $root_cur" >&2
              exit 1
            fi
            IFS=. read -r ROOT_MA ROOT_MI ROOT_PA <<< "$root_cur"
            root_new="$ROOT_MA.$ROOT_MI.$((ROOT_PA + 1))"
            printf '%s\n' "$root_new" > VERSION
            echo "bumped bifrost VERSION for Codex plugins: $root_cur -> $root_new"
          fi

          # 4. Re-sync (re-stamps artifacts with any new Claude bundle
          #    versions), then rebuild. This second build reads the bumped root
          #    VERSION and emits it into dist/codex-plugins before all gates run.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog
            go run ./cmd/stark validate ../catalog
            go run ./cmd/stark sync --from "$SK" --check ../catalog
            go run ./cmd/stark build --check ../catalog
            go run ./cmd/stark check-bumps ../catalog )

      - name: Open or update the sync PR
        id: pr
        working-directory: bifrost
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "marketplace already in sync — nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short="${SRC_SHA::7}"
          branch="auto/marketplace-sync"
          title="chore(sync): regenerate from stark-skills@${short}"
          body="Automated regeneration from stark-skills@${SRC_SHA} by the marketplace-sync workflow. Merged by that workflow once this repo's CI is green."
          git config user.name "stark-claude[bot]"
          git config user.email "stark-claude[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "$title"
          git push --force -u origin "$branch"

          # Ask whether the PR exists instead of inferring it from a failed create.
          # `gh pr create ... 2>/dev/null || echo "already open"` mapped EVERY failure
          # — a revoked token, a missing App install, an API outage — onto the same
          # reassuring line, and the job still went green having published nothing.
          # That is how three syncs (#848/#849/#851) reported success while the fix
          # they carried never reached a single installed plugin.
          num="$(gh pr list --repo 21StarkCom/bifrost --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            # The branch is long-lived and force-pushed, so an existing PR keeps the
            # title of the FIRST sync that opened it while its head moves on. PR #160
            # read "@950f79f" for a head that was already "@e71f532"; anyone trusting
            # the title was reading a stale claim about live content.
            gh pr edit "$num" --repo 21StarkCom/bifrost --title "$title" --body "$body"
            echo "updated existing PR #${num}"
          else
            # NOT draft (exempt from the draft-by-default policy): this is an
            # automated publish PR that must run bifrost's CI and merge once green —
            # there is no local-test/WIP phase to keep it out of CI for. See
            # standards/workflows/skip-draft-guard.md ("What is NOT guarded").
            num="$(gh pr create --repo 21StarkCom/bifrost \
              --head "$branch" --base main --title "$title" --body "$body" \
              | sed -nE 's#.*/pull/([0-9]+).*#\1#p')"
            echo "opened PR #${num}"
          fi
          [ -n "$num" ] || { echo "could not resolve the sync PR number" >&2; exit 1; }
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # Publishing is the point of this workflow, so it does not end at "a PR exists".
      # bifrost has NO required status checks and auto-merge is disabled on the repo, so
      # `--auto` would merge on contact, ahead of its own CI — this waits explicitly
      # instead, and fails the run (loudly, where someone sees it) if bifrost goes red.
      - name: Merge the sync PR once bifrost CI is green
        if: steps.pr.outputs.published == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # A just-pushed head carries no check runs for a few seconds. Wait for one to
          # EXIST — a positive assertion on the count, not on an exit code — because
          # "zero checks" and "all checks green" are the two states `--watch` cannot tell
          # apart, and merging on the first would be a gate that passes by finding
          # nothing to measure.
          count=0
          for _ in $(seq 1 30); do
            count="$(gh pr checks "$PR" --repo 21StarkCom/bifrost --json name --jq 'length' 2>/dev/null || echo 0)"
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          if [ "$count" -eq 0 ]; then
            echo "no check runs registered for PR #${PR} after 5 minutes — refusing to merge unverified" >&2
            exit 1
          fi
          echo "watching $count check run(s) on PR #${PR}"
          gh pr checks "$PR" --repo 21StarkCom/bifrost --watch --fail-fast
          gh pr merge "$PR" --repo 21StarkCom/bifrost --squash
          echo "published: bifrost PR #${PR} merged"

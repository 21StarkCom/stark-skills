# Auto-publish: regenerate bifrost (the marketplace) from this repo (the
# source of truth) and open a draft PR there. A completed operator review on
# the final head and the marketplace's own CI gate publication.
#
# PREREQUISITES (one-time, set in this repo's settings):
#   - Variable STARK_MERIDIAN_CI_APP_ID      = the stark-meridian-ci GitHub App ID (4572744)
#   - Secret   STARK_MERIDIAN_CI_PRIVATE_KEY = the stark-meridian-ci App private key (PEM)
#   - The stark-meridian-ci App must be INSTALLED on 21StarkCom/bifrost with
#     `contents: write` + `pull_requests: write` (it mints a scoped token here to
#     push a branch AND open the PR). The App ships with `pull_requests: write`
#     but only `contents: read` by default — GRANT `contents: write` in the App's
#     permissions, or the `git push` below 403s.
#
# The engine is pure Go (no Node needed): `stark sync` copies the .ts tools
# verbatim into the vendor snapshot; nothing executes them in CI.
name: marketplace-sync

on:
  push:
    branches: [main]
    paths:
      - "skill/**"
      - "tools/**"
      - "global/**"
      - "scripts/**"
      - "standards/**"
      - "runtime-overrides/codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint stark-meridian-ci token (scoped to bifrost)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.STARK_MERIDIAN_CI_APP_ID }}
          private-key: ${{ secrets.STARK_MERIDIAN_CI_PRIVATE_KEY }}
          owner: 21StarkCom
          repositories: bifrost

      - name: Checkout stark-skills (source of truth)
        uses: actions/checkout@v4
        with:
          path: stark-skills

      - name: Checkout bifrost (the marketplace)
        uses: actions/checkout@v4
        with:
          repository: 21StarkCom/bifrost
          path: bifrost
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bifrost/engine/go.sum

      - name: Regenerate, auto-bump changed bundles, rebuild, gate
        working-directory: bifrost
        run: |
          set -euo pipefail
          SK="$GITHUB_WORKSPACE/stark-skills"

          # 1. Regenerate the catalog + vendor snapshot, then build both runtime
          #    surfaces. This first build deliberately reads bifrost's current
          #    root VERSION; if Codex output changes, step 3 bumps VERSION and
          #    the final build emits the new cache-invalidating version.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog )

          # 2. Bump the patch version of every Claude bundle whose rendered
          #    package changed. dist/claude/<bundle> is the complete Claude
          #    distribution surface, including vendored tools/config/prompts.
          #    Do not infer Claude version bumps from catalog paths: the catalog
          #    also carries Codex-only runtime overrides that must not change
          #    Claude package versions.
          changed=$(git status --porcelain dist/claude \
            | sed -nE 's#^.{2} "?dist/claude/([^/]+)/.*#\1#p' \
            | sort -u)
          for b in $changed; do
            f="catalog/$b/bundle.yaml"
            cur=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$f")
            IFS=. read -r MA MI PA <<< "$cur"
            new="$MA.$MI.$((PA + 1))"
            perl -i -pe "s/^version: \\Q$cur\\E\$/version: $new/" "$f"
            echo "bumped $b: $cur -> $new"
          done

          # 3. Every published runtime change advances the root release version.
          #    Codex also uses VERSION as its native plugin cache key.
          if [ -n "$(git status --porcelain dist/claude dist/codex-plugins)" ]; then
            root_cur=$(tr -d '\r\n' < VERSION)
            if ! [[ "$root_cur" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid bifrost VERSION: $root_cur" >&2
              exit 1
            fi
            IFS=. read -r ROOT_MA ROOT_MI ROOT_PA <<< "$root_cur"
            root_new="$ROOT_MA.$ROOT_MI.$((ROOT_PA + 1))"
            printf '%s\n' "$root_new" > VERSION
            echo "bumped bifrost VERSION: $root_cur -> $root_new"
          fi

          # 4. Re-sync (re-stamps artifacts with any new Claude bundle
          #    versions), then rebuild. This second build reads the bumped root
          #    VERSION and emits it into dist/codex-plugins before all gates run.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog
            go run ./cmd/stark validate ../catalog
            go run ./cmd/stark sync --from "$SK" --check ../catalog
            go run ./cmd/stark build --check ../catalog
            go run ./cmd/stark check-bumps ../catalog )

      - name: Open or update the sync PR
        id: pr
        working-directory: bifrost
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "marketplace already in sync — nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short="${SRC_SHA::7}"
          branch="auto/marketplace-sync"
          title="chore(sync): regenerate from stark-skills@${short}"
          body="Automated regeneration from stark-skills@${SRC_SHA}. Publication waits for aryeh-stark's completed /code-review xhigh --fix record on the final head, then green CI. The review body must start with <!-- stark-code-review:complete -->. All findings must be fixed or answered before that attestation."
          # Prepare notes before review and before VERSION triggers signing.
          release_version=$(tr -d '\r\n' < VERSION)
          if grep -Fq "## [$release_version]" CHANGELOG.md; then
            echo "release $release_version already has notes; refusing to rewrite a release" >&2
            exit 1
          fi
          awk -v version="$release_version" -v source="$SRC_SHA" -v short="$short" -v date="$(date -u +%F)" '
            function notes() {
              print "## [" version "] - " date "\n\n### Changed"
              print "- Refresh marketplace packages from [stark-skills@" short "](https://github.com/21StarkCom/stark-skills/commit/" source ").\n"
            }
            !inserted && /^## \[[0-9]/ { notes(); inserted=1 }
            { print }
            END { if (!inserted) notes() }
          ' CHANGELOG.md > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md
          git config user.name "stark-meridian-ci[bot]"
          git config user.email "stark-meridian-ci[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "$title"
          git push --force -u origin "$branch"

          # Ask whether the PR exists instead of inferring it from a failed create.
          # `gh pr create ... 2>/dev/null || echo "already open"` mapped EVERY failure
          # — a revoked token, a missing App install, an API outage — onto the same
          # reassuring line, and the job still went green having published nothing.
          # That is how three syncs (#848/#849/#851) reported success while the fix
          # they carried never reached a single installed plugin.
          num="$(gh pr list --repo 21StarkCom/bifrost --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            # The branch is long-lived and force-pushed, so an existing PR keeps the
            # title of the FIRST sync that opened it while its head moves on. PR #160
            # read "@950f79f" for a head that was already "@e71f532"; anyone trusting
            # the title was reading a stale claim about live content.
            gh pr edit "$num" --repo 21StarkCom/bifrost --title "$title" --body "$body"
            if [ "$(gh pr view "$num" --repo 21StarkCom/bifrost --json isDraft --jq '.isDraft')" != true ]; then
              gh pr ready "$num" --repo 21StarkCom/bifrost --undo
            fi
            echo "updated existing PR #${num}"
          else
            # CI alone never satisfies the mandatory review-before-merge gate.
            num="$(gh pr create --repo 21StarkCom/bifrost \
              --draft --head "$branch" --base main --title "$title" --body "$body" \
              | sed -nE 's#.*/pull/([0-9]+).*#\1#p')"
            echo "opened PR #${num}"
          fi
          [ -n "$num" ] || { echo "could not resolve the sync PR number" >&2; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # Publishing is the point of this workflow, so it does not end at "a PR exists".
      # bifrost has NO required status checks and auto-merge is disabled on the repo, so
      # `--auto` would merge on contact, ahead of its own CI — this waits explicitly
      # instead, and fails the run (loudly, where someone sees it) if bifrost goes red.
      - name: Require completed head review, then merge on green CI
        if: steps.pr.outputs.changed == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # This is an operator attestation, not proof that CI ran a reviewer.
          # The latest submitted operator review on this head must attest that
          # the actual command completed and every finding was fixed or answered.
          # Pages are kept together so an older matching page cannot hide a
          # later CHANGES_REQUESTED or DISMISSED review on the same head.
          # shellcheck disable=SC2016
          review_filter='[.[][] | select(.user.login == "aryeh-stark" and .commit_id == $head and .submitted_at != null)]
            | sort_by(.submitted_at, .id) | last
            | . != null and (.state == "COMMENTED" or .state == "APPROVED")
              and ((.body // "") | startswith("<!-- stark-code-review:complete -->\n") and contains("/code-review xhigh --fix"))'
          completed_review() {
            gh api --paginate --slurp "repos/21StarkCom/bifrost/pulls/$PR/reviews" \
              | jq -e --arg head "$1" "$review_filter" >/dev/null
          }
          reviewed_head=""
          for _ in $(seq 1 120); do
            head=$(gh pr view "$PR" --repo 21StarkCom/bifrost --json headRefOid --jq '.headRefOid')
            if completed_review "$head"; then
              reviewed_head="$head"
              break
            fi
            echo "waiting for completed operator review on $head"
            sleep 10
          done
          if [ -z "$reviewed_head" ]; then
            echo "no completed head review within 20 minutes; PR remains unmerged" >&2
            exit 1
          fi
          if [ "$(gh pr view "$PR" --repo 21StarkCom/bifrost --json isDraft --jq '.isDraft')" = true ]; then
            gh pr ready "$PR" --repo 21StarkCom/bifrost
          fi
          # A just-pushed head carries no check runs for a few seconds. Wait for one to
          # EXIST — a positive assertion on the count, not on an exit code — because
          # "zero checks" and "all checks green" are the two states `--watch` cannot tell
          # apart, and merging on the first would be a gate that passes by finding
          # nothing to measure.
          count=0
          for _ in $(seq 1 30); do
            count="$(gh pr checks "$PR" --repo 21StarkCom/bifrost --json name --jq 'length' 2>/dev/null || echo 0)"
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          if [ "$count" -eq 0 ]; then
            echo "no check runs registered for PR #${PR} after 5 minutes — refusing to merge unverified" >&2
            exit 1
          fi
          echo "watching $count check run(s) on PR #${PR}"
          gh pr checks "$PR" --repo 21StarkCom/bifrost --watch --fail-fast
          base_status=$(gh api "repos/21StarkCom/bifrost/compare/main...$reviewed_head" --jq '.status')
          if [ "$base_status" != ahead ] && [ "$base_status" != identical ]; then
            echo "reviewed head needs a rebase onto current main; merge withheld" >&2
            exit 1
          fi
          if ! completed_review "$reviewed_head"; then
            echo "completed head review changed while waiting for CI; merge withheld" >&2
            exit 1
          fi
          gh pr merge "$PR" --repo 21StarkCom/bifrost --squash --match-head-commit "$reviewed_head"
          echo "published: bifrost PR #${PR} merged"

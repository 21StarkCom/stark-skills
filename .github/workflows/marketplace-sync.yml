# Regenerate bifrost (the marketplace) from this repo (the source of truth) and
# open or refresh a draft PR there. This workflow does NOT publish: since
# STARK-6208 the merge is owned by bifrost's own `publish-sync-pr` workflow,
# which fires on the operator's review attestation. A completed operator review
# on the final head and the marketplace's own CI still gate publication — see
# the note above the last step for why the wait moved repos.
#
# PREREQUISITES (one-time, set in this repo's settings):
#   - Variable STARK_MERIDIAN_CI_APP_ID      = the stark-meridian-ci GitHub App ID (4572744)
#   - Secret   STARK_MERIDIAN_CI_PRIVATE_KEY = the stark-meridian-ci App private key (PEM)
#   - The stark-meridian-ci App must be INSTALLED on 21StarkCom/bifrost with
#     `contents: write` + `pull_requests: write` (it mints a scoped token here to
#     push a branch AND open the PR). The App ships with `pull_requests: write`
#     but only `contents: read` by default — GRANT `contents: write` in the App's
#     permissions, or the `git push` below 403s.
#
# The engine is pure Go (no Node needed): `stark sync` copies the .ts tools
# verbatim into the vendor snapshot; nothing executes them in CI.
name: marketplace-sync

on:
  push:
    branches: [main]
    paths:
      - "skill/**"
      - "tools/**"
      - "global/**"
      - "scripts/**"
      - "standards/**"
      - "runtime-overrides/codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint stark-meridian-ci token (scoped to bifrost)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.STARK_MERIDIAN_CI_APP_ID }}
          private-key: ${{ secrets.STARK_MERIDIAN_CI_PRIVATE_KEY }}
          owner: 21StarkCom
          repositories: bifrost

      - name: Checkout stark-skills (source of truth)
        uses: actions/checkout@v4
        with:
          path: stark-skills

      - name: Checkout bifrost (the marketplace)
        uses: actions/checkout@v4
        with:
          repository: 21StarkCom/bifrost
          path: bifrost
          token: ${{ steps.app-token.outputs.token }}

      # Every skill in THIS repo must be claimed by some bifrost bundle.yaml, or
      # deliberately excluded. `stark sync` below pulls ONLY declared members, so an
      # unclaimed skill is silently dropped: it lands in no catalog copy and neither
      # dist tree, while its prose ships. That is exactly how `agnes` shipped
      # un-membered at bifrost v0.31.2 (STARK-6249) — the release published
      # standards/worker-spine.md naming "/agnes" while the skill itself went nowhere,
      # and every gate below reported clean. `validate`, `build --check` and
      # `check-bumps` only compare bifrost's catalog against bifrost's dist; `sync
      # --check` IS cross-repo and regenerates from this tree, but it reads only the
      # skills a bundle already declares. None of them asks the one question this step
      # asks: is every skill up here claimed by anything at all?
      #
      # Runs BEFORE the regen so an unclaimed skill fails the sync rather than opening a
      # PR that looks publishable. The script is bifrost's (it reads bifrost's catalog
      # membership) and is the SAME file publish.sh calls — do not inline a copy here,
      # two copies of a gate is how it ends up enforced in one place and not the other,
      # which is the bug this step exists to close (STARK-6468).
      #
      # A RED run here means publication is STOPPED, not "unpublished but fine": this
      # step precedes the regen, so no sync PR is opened or refreshed at all, and every
      # later push to main fails here too until the membership lands in bifrost. Land a
      # new skill's bundle membership in bifrost BEFORE merging the skill here.
      #
      # The script path is a cross-repo contract with bifrost's default branch. Check it
      # explicitly: a bare invocation of a moved, renamed or non-executable script dies
      # at exit 127/126 with "No such file or directory", which reads as a broken
      # workflow rather than as the contract break it is.
      - name: Coverage gate — every skill is claimed by a bundle
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/bifrost/docs/scripts/coverage-gate.sh"
          if [ ! -x "$gate" ]; then
            # stdout, not stderr: GitHub parses ::error:: workflow commands off a
            # step's standard output, so redirecting it hides the annotation.
            echo "::error::bifrost's default branch no longer ships an executable docs/scripts/coverage-gate.sh at that path; marketplace-sync depends on it (STARK-6468). Restore it, or update this step in lockstep."
            exit 1
          fi
          "$gate" "$GITHUB_WORKSPACE/stark-skills"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bifrost/engine/go.sum

      - name: Regenerate, auto-bump changed bundles, rebuild, gate
        working-directory: bifrost
        run: |
          set -euo pipefail
          SK="$GITHUB_WORKSPACE/stark-skills"

          # 1. Regenerate the catalog + vendor snapshot, then build both runtime
          #    surfaces. This first build deliberately reads bifrost's current
          #    root VERSION; if Codex output changes, step 3 bumps VERSION and
          #    the final build emits the new cache-invalidating version.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog )

          # 2. Bump the patch version of every Claude bundle whose rendered
          #    package changed. dist/claude/<bundle> is the complete Claude
          #    distribution surface, including vendored tools/config/prompts.
          #    Do not infer Claude version bumps from catalog paths: the catalog
          #    also carries Codex-only runtime overrides that must not change
          #    Claude package versions.
          changed=$(git status --porcelain dist/claude \
            | sed -nE 's#^.{2} "?dist/claude/([^/]+)/.*#\1#p' \
            | sort -u)
          for b in $changed; do
            f="catalog/$b/bundle.yaml"
            cur=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$f")
            IFS=. read -r MA MI PA <<< "$cur"
            new="$MA.$MI.$((PA + 1))"
            perl -i -pe "s/^version: \\Q$cur\\E\$/version: $new/" "$f"
            echo "bumped $b: $cur -> $new"
          done

          # 3. Every published runtime change advances the root release version.
          #    Codex also uses VERSION as its native plugin cache key.
          if [ -n "$(git status --porcelain dist/claude dist/codex-plugins)" ]; then
            root_cur=$(tr -d '\r\n' < VERSION)
            if ! [[ "$root_cur" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid bifrost VERSION: $root_cur" >&2
              exit 1
            fi
            IFS=. read -r ROOT_MA ROOT_MI ROOT_PA <<< "$root_cur"
            root_new="$ROOT_MA.$ROOT_MI.$((ROOT_PA + 1))"
            printf '%s\n' "$root_new" > VERSION
            echo "bumped bifrost VERSION: $root_cur -> $root_new"
          fi

          # 4. Re-sync (re-stamps artifacts with any new Claude bundle
          #    versions), then rebuild. This second build reads the bumped root
          #    VERSION and emits it into dist/codex-plugins before all gates run.
          ( cd engine
            go run ./cmd/stark sync --from "$SK" ../catalog
            go run ./cmd/stark build ../catalog
            go run ./cmd/stark validate ../catalog
            go run ./cmd/stark sync --from "$SK" --check ../catalog
            go run ./cmd/stark build --check ../catalog
            go run ./cmd/stark check-bumps ../catalog )

      - name: Open or update the sync PR
        id: pr
        working-directory: bifrost
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "marketplace already in sync — nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short="${SRC_SHA::7}"
          branch="auto/marketplace-sync"
          title="chore(sync): regenerate from stark-skills@${short}"
          body="Automated regeneration from stark-skills@${SRC_SHA}. Publication waits for aryeh-stark's completed /code-review xhigh --fix record on the final head, then green CI. The review body must open with <!-- stark-code-review:complete --> on its own first line, and name the /code-review xhigh --fix invocation. All findings must be fixed or answered before that attestation."
          # Prepare notes before review and before VERSION triggers signing.
          release_version=$(tr -d '\r\n' < VERSION)
          if grep -Fq "## [$release_version]" CHANGELOG.md; then
            # Step 3 only advances VERSION when a rendered runtime changed, so this
            # state means the diff is catalog-only and its notes already shipped with
            # the release that carries this version. Sync it WITHOUT rewriting a
            # released section — aborting here would strand a legitimate publish.
            echo "release $release_version already has notes; syncing without new notes"
          else
            # Keep a Changelog: the release ABSORBS whatever accumulated under [Unreleased].
            # Inserting at the first NUMBERED heading instead (`!inserted && /^## \[[0-9]/`)
            # leaves those bullets stranded above the new section forever, so the tag ships
            # work its own notes never mention. Bifrost hand-repaired 13 such bullets in its
            # PR #265, and the very next sync reproduced the defect — hence this rewrite.
            awk -v version="$release_version" -v source="$SRC_SHA" -v short="$short" -v date="$(date -u +%F)" '
              function refresh() {
                print "- Refresh marketplace packages from [stark-skills@" short "](https://github.com/21StarkCom/stark-skills/commit/" source ")."
              }
              # The Refresh bullet joins an existing "### Changed" rather than adding a second one.
              # Keep a Changelog section order, so the Refresh bullet lands in position
              # rather than after whatever the body already had. Anchored exactly like the
              # heading test below used to be, and now the ONLY reading of "is this line a
              # section heading": with a bare /^### Changed/ prefix, a line reading
              # "### Changed since 1.2.2" ranked 2 here while matching nothing below, so the
              # generated section was stranded at the very end instead of placed.
              function rank(h) {
                if (h ~ /^### Added[[:space:]]*$/) return 1
                if (h ~ /^### Changed[[:space:]]*$/) return 2
                if (h ~ /^### Deprecated[[:space:]]*$/) return 3
                if (h ~ /^### Removed[[:space:]]*$/) return 4
                if (h ~ /^### Fixed[[:space:]]*$/) return 5
                if (h ~ /^### Security[[:space:]]*$/) return 6
                return 99
              }
              function flush_notes(   i, r, start, seen, owned) {
                print "## [" version "] - " date "\n"
                # Drop the blank that followed "## [Unreleased]"; the heading above supplied one.
                for (start = 0; start < n && body[start] ~ /^[[:space:]]*$/; start++) ;
                # Does the body already own a "### Changed"? Decided BEFORE anything is
                # emitted. A body whose own "### Changed" sits AFTER a later-ranked heading
                # (Fixed, then Changed) otherwise gets one inserted at the Fixed boundary and
                # keeps its own too, shipping two "### Changed" sections in one release.
                # Reordering sections someone else wrote out of order is not this job;
                # emitting the Refresh bullet exactly once, under one heading, is.
                for (i = start; i < n; i++) if (rank(body[i]) == 2) { owned = 1; break }
                for (i = start; i < n; i++) {
                  # Only the FIRST one: a body carrying two "### Changed" headings would
                  # otherwise get the Refresh bullet under each.
                  if (!seen && rank(body[i]) == 2) { print body[i]; refresh(); seen = 1; continue }
                  # A later-ranked heading means "### Changed" belongs here, before it —
                  # unless the body has one of its own further down to absorb the bullet.
                  r = rank(body[i])
                  if (!owned && !seen && r > 2 && r < 99) { print "### Changed"; refresh(); print ""; seen = 1 }
                  print body[i]
                }
                # Nothing ranked after Changed in the body: append, which is also in order.
                if (!seen) { print "### Changed"; refresh(); print "" }
                else if (body[n - 1] !~ /^[[:space:]]*$/) print ""   # seen implies n > 0
                inserted = 1
              }
              # Keep [Unreleased] as an empty heading and buffer its body for replay below.
              # Every rule below is guarded by !inserted: exactly one section is emitted, and a
              # CHANGELOG whose first numbered heading somehow precedes [Unreleased] replays its
              # body verbatim instead of either duplicating the section or swallowing the body.
              /^## \[[Uu]nreleased\]/ { print; print ""; unreleased = 1; next }
              unreleased && !inserted && /^## \[/ { flush_notes(); unreleased = 0 }
              !unreleased && !inserted && /^## \[[0-9]/ { flush_notes() }
              unreleased && !inserted { body[n++] = $0; next }
              { last = $0; print }
              # Appending at EOF needs one blank line between the old tail and the new heading —
              # but only one. A CHANGELOG that already ends with a blank line got a second,
              # since this branch printed unconditionally. `last` is the final line actually
              # emitted, and it is only consulted on the !unreleased path, where the catch-all
              # above printed every record.
              END { if (!inserted) { if (!unreleased && last !~ /^[[:space:]]*$/) print ""; flush_notes() } }
            ' CHANGELOG.md > CHANGELOG.md.next
            mv CHANGELOG.md.next CHANGELOG.md
          fi
          git config user.name "stark-meridian-ci[bot]"
          git config user.email "stark-meridian-ci[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "$title"
          git push --force -u origin "$branch"

          # Ask whether the PR exists instead of inferring it from a failed create.
          # `gh pr create ... 2>/dev/null || echo "already open"` mapped EVERY failure
          # — a revoked token, a missing App install, an API outage — onto the same
          # reassuring line, and the job still went green having published nothing.
          # That is how three syncs (#848/#849/#851) reported success while the fix
          # they carried never reached a single installed plugin.
          num="$(gh pr list --repo 21StarkCom/bifrost --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            # The branch is long-lived and force-pushed, so an existing PR keeps the
            # title of the FIRST sync that opened it while its head moves on. PR #160
            # read "@950f79f" for a head that was already "@e71f532"; anyone trusting
            # the title was reading a stale claim about live content.
            gh pr edit "$num" --repo 21StarkCom/bifrost --title "$title" --body "$body"
            # Read into a variable first: inside `[ "$(...)" != true ]` a failed
            # `gh pr view` is invisible to `set -e` and its empty output reads as
            # "not a draft", so a transport error would force-draft a live PR.
            is_draft="$(gh pr view "$num" --repo 21StarkCom/bifrost --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != true ]; then
              gh pr ready "$num" --repo 21StarkCom/bifrost --undo
            fi
            echo "updated existing PR #${num}"
          else
            # CI alone never satisfies the mandatory review-before-merge gate.
            num="$(gh pr create --repo 21StarkCom/bifrost \
              --draft --head "$branch" --base main --title "$title" --body "$body" \
              | sed -nE 's#.*/pull/([0-9]+).*#\1#p')"
            echo "opened PR #${num}"
          fi
          [ -n "$num" ] || { echo "could not resolve the sync PR number" >&2; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # Publication is NOT done here. This workflow ends at "the sync branch is
      # pushed and its PR is open and current"; bifrost's own `publish-sync-pr`
      # workflow merges it when the operator's attestation lands.
      #
      # STARK-6208: this step used to wait up to 20 minutes for that attestation
      # and then run the ready/CI/merge chain. The window could not close at the
      # fleet's real merge cadence. Measured 2026-09-19, six consecutive runs
      # published nothing — four expired the deadline, and the two after them
      # were killed at 6 and 9 minutes by this workflow's own
      # `cancel-in-progress` when the next stark-skills merge landed. Every
      # regeneration from e5d2441 onward was generated and stranded.
      #
      # Moving publication onto bifrost's `pull_request_review` event removes the
      # clock entirely: the attestation may arrive minutes or days later. It also
      # makes `cancel-in-progress` above correct rather than destructive — a
      # superseded REGENERATION should die; a pending PUBLICATION should not.
      #
      # The gate is unchanged, not relaxed: bifrost re-verifies the same author,
      # the same `<!-- stark-code-review:complete -->` marker on its own first
      # line, the same named `/code-review xhigh --fix` invocation, the same
      # exact-head binding, the same pre-merge recheck and the same
      # `--match-head-commit`. CI alone still never authorizes publication.
      # No GH_TOKEN: this step calls no `gh`, and the App token is write-scoped
      # on bifrost. A step that needs nothing gets nothing.
      - name: Report where publication stands
        if: steps.pr.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo "sync PR #${PR} is current: https://github.com/21StarkCom/bifrost/pull/${PR}"
          echo "publication waits for aryeh-stark's completed review attestation on its head;"
          echo "bifrost's publish-sync-pr workflow merges it when that lands."

# Run the TypeScript test suite.
#
# This gate exists because nothing ran these tests until 2026-08-11: a broken
# `runtime_overrides.test.ts` sat red on `main` across three merged PRs (#866,
# #867, #868) and no one could have known. The CodeQL "Analyze" checks that
# already run on PRs are code scanning, not tests.
#
# The suite needs no dependency install — every import is a `node:` builtin, and
# `tools/`'s only devDependencies (typescript, @types/node) belong to the
# `typecheck` job below, which is its own required check (STARK-5008). So there
# is no `npm ci` on the test path.

name: tests

on:
  pull_request:
    # `ready_for_review` is redundant for THIS workflow now that no job is
    # draft-guarded — `opened`/`synchronize` already produced a real result for
    # the head sha. It is kept because it costs one cheap run and covers the
    # case where the un-draft is the only signal the merge tooling is waiting
    # on. It does mean two runs can report the same check for one sha; the merge
    # gate collapses same-named contexts to the latest, and nothing is cancelled
    # (see the concurrency note below).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Fire the gate by hand without pushing. Useful for re-running against a
  # branch, but NOT a repair for a missing PR check: a `workflow_dispatch` run
  # does not join a pull request's status rollup. Measured on #877 — the
  # dispatch produced `test: SUCCESS` on the head sha while the rollup
  # (and therefore every merge gate reading it) still carried `test: SKIPPED`.
  workflow_dispatch: {}

# Serialize per PR / branch, but NEVER cancel — `test` and `typecheck` are both
# required checks.
#
# `cancel-in-progress: true` was correct while the jobs were draft-guarded: they
# finished in ~5 seconds, so there was never anything in flight to cancel. Now
# they take ~1 minute, and `pr-merge` force-pushes and then marks the PR ready
# moments later — two events for the SAME sha. Cancelling meant the second run
# killed the first and left `test: CANCELLED` sitting on the head commit.
#
# GitHub counts CANCELLED as a failing required check, so that row can block the
# merge outright, and if the replacement run never materializes it is the ONLY
# row — a required check that reports failure for a commit whose suite actually
# passed. A workflow backing a required check should not manufacture rows for
# runs it intends to discard.
#
# The cost is a wasted ~1 runner-minute when two pushes land close together.
# That is cheaper than either failure mode it removes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # DELIBERATELY NOT draft-guarded — the carve-out in
  # standards/workflows/skip-draft-guard.md. A guarded job reports `skipped`,
  # which GitHub counts as satisfying a required check and renders identically
  # to a pass, so a lost run reads as green. #877 merged that way: the only
  # `pull_request` run on its head sha was the draft-time one, and no repair
  # existed (a re-run replays the original payload and skips again; a dispatch
  # run never joins the rollup). Running unconditionally makes every commit
  # carry a real conclusion. It costs ~1 runner-minute per push and this suite
  # installs nothing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Type-stripping runs `.ts` with no build step but is only ON by
          # default from Node 23.6; `node:sqlite` (tools/stark_persona_lib.ts)
          # also needs a recent runtime. 24 is the oldest LTS carrying both.
          node-version: '24'

      # Coverage gate at PR TIME, so an unclaimed skill goes red on the PR that adds
      # it rather than on `main` (STARK-6468).
      #
      # `marketplace-sync` runs this same script before its regen, which is what closes
      # the hole that shipped `agnes` un-membered (STARK-6249). But that gate fires
      # AFTER merge: it precedes the regen, so a skill reaching `main` unclaimed opens no
      # sync PR and every later push fails there too — publication stops for everyone,
      # including changes unrelated to the offending skill, until a human lands bundle
      # membership in bifrost. Catching it here keeps `main` publishable and puts the
      # failure in front of the person who can fix it.
      #
      # bifrost is public, so this needs no token. It is checked out to a subdirectory
      # that nothing else reads: `npm test` runs from tools/ and check-rest-only.sh
      # scopes itself to named files there, so the extra tree cannot perturb either.
      - name: Checkout bifrost (for the coverage gate)
        uses: actions/checkout@v6
        with:
          repository: 21StarkCom/bifrost
          path: .bifrost-gate

      - name: Coverage gate — every skill is claimed by a bundle
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/.bifrost-gate/docs/scripts/coverage-gate.sh"
          if [ ! -x "$gate" ]; then
            # stdout, not stderr: GitHub parses ::error:: workflow commands off stdout.
            echo "::error::bifrost's default branch no longer ships an executable docs/scripts/coverage-gate.sh at that path; this gate and marketplace-sync both depend on it (STARK-6468). Restore it, or update both callers in lockstep."
            exit 1
          fi
          "$gate" "$GITHUB_WORKSPACE"

      # `npm test` = ./check-rest-only.sh && node --test *.test.ts. Run it from
      # tools/, which is where package.json lives — the repo has no root
      # package.json.
      - name: Run tests
        working-directory: tools
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install typecheck deps
        working-directory: tools
        run: npm ci

      # `typecheck` is a REQUIRED status check on `main` (ruleset 20607400,
      # STARK-5008), and this step reports the real `tsc` result, so a type
      # regression blocks the merge instead of landing.
      #
      # It has to be its own gate because `node --test` does NOT typecheck: the
      # suite runs `.ts` through Node's type-stripping, which erases annotations
      # rather than checking them. A wrong generic, a bad annotation or an
      # unsound cast passes every test in the `test` job.
      #
      # NEVER put `continue-on-error: true` back on this step. It carried that
      # flag while the check was advisory, which made the CHECK report SUCCESS
      # whether or not `tsc` passed — errors visible only in the step log. That
      # is why the check could not simply be added to the ruleset: requiring a
      # `continue-on-error` step satisfies the gate unconditionally, the same
      # false-green shape this workflow was rewritten to remove. Re-adding it
      # would silently turn a required check back into decoration, so
      # `tools/typecheck_gate.test.ts` fails the suite if it reappears.
      #
      # `npm run typecheck`, NOT `npx tsc -p .`: with no TTY on stdin, `npx`
      # downloads a missing package from the registry instead of failing, so a
      # dropped devDependency would move this required gate onto an unpinned
      # latest TypeScript without a word. `npm run` resolves the locked local
      # binary or errors.
      - name: Typecheck
        working-directory: tools
        run: npm run typecheck
